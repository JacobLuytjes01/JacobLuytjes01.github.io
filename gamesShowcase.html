    <h2 class="title">My Unity Games</h2>
    <div class="grid">
        <figure class="game-card">
            <img src="photos/boxMover_output.webp" alt="Box Mover - The player is in the bottom left corner. In a hallway to the left, there is a box at the top left. In a separate room to the right, an enemy is moving towards the player and the goal." title="Box Mover">
            <figcaption class="game-title">Box Mover</figcaption>
            <p class="game-description">Move a box to a goal while avoiding foes</p>
        </figure>
        <figure class="game-card">
            <img src="photos/dartGame_output.webp" alt="Dart Game - The player is in the top right with red walls to their right and below them. The goal is to the left." title="Dart Game">
            <figcaption class="game-title">Dart Game</figcaption>
            <p class="game-description">A precision top down platformer</p>
        </figure>
        <figure class="game-card">
            <img src="photos/diffPerpGame_output.webp" alt="Diff Perp Game - The player is viewed from a top down perspective, set against a green background and a blue wall to their right." title="Diff Perp Game">
            <figcaption class="game-title">Diff Perp Game</figcaption>
            <p class="game-description">Move the camera to see the obstacles</p>
        </figure>
        <figure class="game-card">
            <img src="photos/popBalloon_output.webp" alt="Pop Balloon - First-person perspective, holding a sniper rifle with many balloons in the distance. The sky is blue with white splotches." title="Pop Balloon">
            <figcaption class="game-title">Pop Balloon</figcaption>
            <p class="game-description">A simple first-person shooter</p>
        </figure>
        <figure class="game-card">
            <img src="photos/carRacer_output.webp" alt="Car Racer - A low-poly car on a large floating platform with a ramp off in the distance to the right. The sky is blue with white splotches." title="Car Racer">
            <figcaption class="game-title">Car Racer</figcaption>
            <p class="game-description">A racing game on floating platforms</p>
        </figure>
        <figure class="game-card">
            <img src="photos/rocketJump_output.webp" alt="Rocket Jump - First-person perspective, holding a rocket launcher with many slanted walls and platforms in the distance." title="Rocket Jump">
            <figcaption class="game-title">Rocket Jump</figcaption>
            <p class="game-description">A game inspired by tf2's rocket jump</p>
        </figure>
        <figure class="game-card">
            <img src="photos/puzzleGame_output.webp" alt="Puzzle Game - A grid of squares with the player in the bottom right corner." title="Puzzle Game">
            <figcaption class="game-title">Puzzle Game</figcaption>
            <p class="game-description">Try to touch every square once</p>
        </figure>
        <figure class="game-card">
            <img src="photos/stealthGame_output.webp" alt="Stealth Game - A grid of squares with movable tiles and walls. An enemy stands between the player and the goal." title="Stealth Game">
            <figcaption class="game-title">Stealth Game</figcaption>
            <p class="game-description">A turn based stealth game</p>
        </figure>
